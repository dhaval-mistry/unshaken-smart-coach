# Single-process local development. Blocks, WAL and working data use separate paths.
multitenancy_enabled: false
server:
  http_listen_port: 9009
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/bucket-sync
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: inmemory
distributor:
  ring:
    kvstore:
      store: inmemory
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory
limits:
  # Old blocks are removed asynchronously by the compactor, not at an exact time.
  compactor_blocks_retention_period: 72h
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory
