# Opt-in overlay. Keep authentication settings and TLS state out of the
# default backend, PostgreSQL, and observability Compose workflows.
services:
  backend:
    user: "${USC_AUTH_BACKEND_USER:-10001:10001}"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips
      - 127.0.0.1
    environment:
      USC_AUTH_SETTINGS_FILE: /run/secrets/unshaken-authentication.json
    ports: !override
      - "127.0.0.1:8443:8443"
      - "[::1]:8443:8443"
    volumes:
      - type: bind
        source: "${USC_LOCAL_AUTH_FILE:?Set USC_LOCAL_AUTH_FILE to the private Google settings file}"
        target: /run/secrets/unshaken-authentication.json
        read_only: true
        bind:
          create_host_path: false

  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    # The shared namespace lets the API listen only on loopback and trust
    # only this local proxy. Host HTTPS ports are published on backend.
    network_mode: service:backend
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./local/auth/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local/auth/ui:/srv:ro
      - local_auth_caddy_data:/data
      - local_auth_caddy_config:/config

volumes:
  local_auth_caddy_data:
  local_auth_caddy_config:
