[project]
name = "unshaken-backend"
version = "0.1.0"
description = "UNShaken database foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
unshaken-db = "app.db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
